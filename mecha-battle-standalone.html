<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>像素机甲对战 · Pixel Mecha Battle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: #0b0b14;
  color: #eaeaff;
  font-family: 'Courier New', ui-monospace, monospace;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  position: fixed;
  inset: 0;
}

/* ---------- 全屏布局（移动端优先） ---------- */
#app { position: absolute; inset: 0; }
#stage {
  position: absolute; inset: 0;
  background: #0a0a14;
  overflow: hidden;
}

canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* CRT 扫描线 */
#stage::after {
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
    rgba(0,0,0,0.10) 2px, rgba(0,0,0,0.10) 3px
  );
  mix-blend-mode: overlay;
  z-index: 30;
}

/* ---------- HUD ---------- */
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  z-index: 10;
  pointer-events: none;
}
.fighter { flex: 1; min-width: 0; }
.fighter .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
.fighter .name { font-size: clamp(11px, 2.6vw, 14px); font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 6px currentColor; }
.fighter.me .name { color: #62c8ff; }
.fighter .buff { font-size: clamp(9px, 2vw, 11px); color: #9fe8ff; }
.mid { text-align: center; flex: 0 0 auto; min-width: 46px; }
.mid .vs { font-weight: bold; font-size: clamp(12px, 2.8vw, 16px); color: #ffd23f; text-shadow: 0 0 8px #ffd23f; }
.mid .room { font-size: clamp(9px, 2vw, 11px); color: #9fd8ff; letter-spacing: 1px; min-height: 12px; }

.hpbar {
  height: clamp(10px, 2.6vw, 14px);
  background: rgba(255,255,255,0.08);
  border: 2px solid #333;
  overflow: hidden;
}
.hpfill { height: 100%; width: 100%; transition: width 0.15s linear; }
.hpfill.me { background: linear-gradient(#62c8ff, #1f78c8); }
.wep { font-size: clamp(9px, 2vw, 11px); color: #9fe8ff; margin-top: 3px; min-height: 12px; }

/* ---------- 多人 HUD：右上其他玩家血条列表 ---------- */
#others {
  flex: 0 0 auto;
  width: clamp(120px, 26vw, 190px);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.mini-fighter { display: flex; flex-direction: column; gap: 2px; }
.mini-fighter .mf-row { display: flex; justify-content: flex-end; }
.mini-fighter .mf-name {
  font-size: clamp(9px, 2vw, 11px); font-weight: bold; letter-spacing: 1px;
  text-shadow: 0 0 6px currentColor;
}
.mini-fighter .mf-bar {
  height: clamp(7px, 1.8vw, 10px);
  background: rgba(255,255,255,0.08);
  border: 2px solid #333;
  overflow: hidden;
}
.mini-fighter .mf-fill { height: 100%; width: 100%; transition: width 0.15s linear; }
.mini-fighter.ko { opacity: 0.32; }
.mini-fighter.ko .mf-fill { filter: grayscale(1); }

#btn-menu {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right));
  z-index: 20;
  width: 38px; height: 38px;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.3);
  background: rgba(20,20,40,0.5);
  color: #eaeaff;
  font-size: 18px;
  cursor: pointer;
}
#btn-menu:active { background: rgba(120,160,255,0.4); }

/* ---------- 触摸虚拟按键 ---------- */
#touch { display: none; }
body.touch #touch { display: block; }
#touch { position: absolute; inset: 0; z-index: 15; pointer-events: none; }

/* 基础按键容器（横屏/桌面） */
.pad {
  position: absolute;
  bottom: max(20px, env(safe-area-inset-bottom));
  display: flex; gap: 14px; align-items: flex-end;
  pointer-events: auto;
}
.pad.left { left: max(12px, env(safe-area-inset-left)); }
.pad.right { right: max(12px, env(safe-area-inset-right)); }

.tbtn {
  border-radius: 16px;
  border: 2px solid rgba(255,255,255,0.35);
  background: rgba(20,20,40,0.55);
  color: #eaeaff;
  font-family: inherit;
  font-weight: bold;
  user-select: none;
  touch-action: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  -webkit-tap-highlight-color: transparent;
}

/* 默认（横屏/桌面）按键尺寸 */
.tbtn.move { width: 76px; height: 76px; font-size: 26px; }
.tbtn.jump { width: 68px; height: 68px; font-size: 22px; color: #8fd8ff; }
.tbtn.atk  { width: 90px; height: 90px; font-size: 24px; color: #ff9a9a; border-color: rgba(255,150,150,0.5); }
.tbtn.def  { width: 62px; height: 62px; font-size: 16px; color: #9fd8ff; }

/* ===== 竖屏触摸设备：重新设计布局，防止按钮重叠 ===== */
/* 仅在真正的触摸设备竖屏模式下应用（不包括桌面模式的手机浏览器） */
@media (orientation: portrait) and (hover: none) {
  .pad {
    gap: 8px;
    bottom: max(18px, env(safe-area-inset-bottom));
    flex-wrap: nowrap;
  }
  .pad.left {
    left: max(8px, env(safe-area-inset-left));
    max-width: 42vw;
  }
  /* 右侧：改为 2 列网格布局，避免换行导致重叠 */
  /* 注意：必须给明确宽度，grid 的 1fr 才能正确分割 */
  .pad.right {
    right: max(8px, env(safe-area-inset-right));
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 8px;
    width: calc(min(42vw, 180px));
  }
  /* 右侧按钮网格定位：攻(左上)、跳(右上)、防(下方横跨) */
  .pad.right .tbtn.atk  { grid-column: 1; grid-row: 1; }
  .pad.right .tbtn.jump { grid-column: 2; grid-row: 1; }
  .pad.right .tbtn.def  { grid-column: 1 / span 2; grid-row: 2; }

  /* 竖屏按键尺寸：自适应屏幕宽度 */
  .pad.left .tbtn.move {
    width: calc(min(20vw, 76px)); height: calc(min(20vw, 76px));
    font-size: calc(min(6vw, 24px));
  }
  .pad.right .tbtn.atk {
    width: 100%; aspect-ratio: 1;
    font-size: calc(min(7vw, 22px));
  }
  .pad.right .tbtn.jump {
    width: 100%; aspect-ratio: 1;
    font-size: calc(min(6vw, 20px));
  }
  .pad.right .tbtn.def {
    width: 100%; aspect-ratio: 1.8;
    font-size: calc(min(5vw, 16px));
  }
}

/* 窄屏触摸竖屏（<=360px）：按键再缩小一点 */
@media (orientation: portrait) and (hover: none) and (max-width: 360px) {
  .pad { gap: 6px; }
  .pad.right { gap: 6px; width: calc(min(44vw, 160px)); }
  .pad.left .tbtn.move { width: 60px; height: 60px; font-size: 20px; }
}

.tbtn.on {
  background: rgba(120,160,255,0.55);
  border-color: #fff;
  transform: scale(0.94);
  box-shadow: 0 0 12px rgba(120,160,255,0.6);
}

/* ---------- 覆盖层 ---------- */
.overlay {
  position: absolute; inset: 0;
  z-index: 25;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  gap: 12px;
  background: rgba(6,6,16,0.82);
  backdrop-filter: blur(3px);
  padding: 20px;
  text-align: center;
}
.overlay.hidden { display: none; }

#announce {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(30px, 12vmin, 64px);
  font-weight: bold; letter-spacing: 6px;
  color: #ffd23f; text-shadow: 0 0 16px #ffd23f;
  pointer-events: none; opacity: 0;
  z-index: 22;
}
#announce.show { animation: flash 1.2s ease-out forwards; }
@keyframes flash {
  0%   { opacity: 0; transform: scale(0.6); }
  20%  { opacity: 1; transform: scale(1); }
  70%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.15); }
}

#ko .big { font-size: clamp(24px, 8vmin, 44px); font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 12px currentColor; }
#ko .sub { font-size: clamp(11px, 2.6vmin, 14px); color: #cfd2ff; }

/* ---------- 菜单 ---------- */
#menu h1 {
  font-size: clamp(22px, 7vmin, 40px);
  letter-spacing: 6px;
  color: #ffd23f;
  text-shadow: 0 0 14px rgba(255,210,63,0.7);
}
#menu .tag { font-size: clamp(9px, 2.2vmin, 12px); color: #7a7aa8; letter-spacing: 4px; margin-bottom: 6px; }
.menu-box {
  display: flex; flex-direction: column; gap: 12px;
  width: min(340px, 88vw);
}
.mbtn {
  min-height: 48px;
  border-radius: 10px;
  border: 2px solid rgba(120,160,255,0.5);
  background: rgba(30,40,80,0.6);
  color: #eaeaff;
  font-family: inherit;
  font-size: clamp(14px, 3.4vmin, 17px);
  font-weight: bold;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.mbtn:active { background: rgba(120,160,255,0.4); transform: scale(0.97); }
.mbtn.big { min-height: 54px; }
.mbtn.ghost { border-color: rgba(255,255,255,0.25); color: #aab; min-height: 42px; }
.mbtn.hidden { display: none; }

.join-row { display: flex; gap: 10px; }
/* 本地文件模式：隐藏联机入口 */
.join-row.hidden { display: none; }
.join-row input {
  flex: 1; min-width: 0;
  border-radius: 10px;
  border: 2px solid rgba(120,160,255,0.4);
  background: rgba(10,10,25,0.8);
  color: #ffd23f;
  font-family: inherit;
  font-size: clamp(16px, 4vmin, 20px);
  letter-spacing: 6px;
  text-align: center;
  text-transform: uppercase;
  padding: 6px;
}
.join-row .mbtn { flex: 0 0 96px; }

#net-status { font-size: clamp(11px, 2.6vmin, 13px); color: #9fd8ff; line-height: 1.7; min-height: 20px; }
#net-status .code { color: #ffd23f; font-size: 1.5em; letter-spacing: 6px; }
#net-status .dim { color: #7a7aa8; font-size: 0.9em; }
#menu.waiting .join-row, #menu.waiting > .menu-box > .mbtn { display: none; }

/* ---------- 多人大厅 ---------- */
#lobby { z-index: 26; }
.lobby-title {
  font-size: clamp(16px, 4.6vmin, 24px);
  letter-spacing: 4px;
  color: #62c8ff;
  text-shadow: 0 0 10px rgba(98,200,255,0.6);
}
.lobby-card {
  display: flex; flex-direction: column; gap: 6px;
  width: min(320px, 88vw);
}
.lobby-player {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.10);
  font-size: clamp(12px, 3vmin, 15px);
  letter-spacing: 1px;
}
.lobby-player.empty {
  justify-content: center;
  color: #666c90;
  border-style: dashed;
  background: transparent;
}
.lobby-player .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.lobby-player .host-tag { margin-left: auto; font-size: 0.78em; color: #ffd23f; letter-spacing: 2px; }
#lobby-hint { text-align: center; color: #9fd8ff; font-size: clamp(10px, 2.4vmin, 12px); letter-spacing: 1px; }

/* 邀请链接（互联网/局域网分享） */
.share-box {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px;
}
.share-box.hidden { display: none; }
.share-box .share-label {
  flex: 0 0 auto;
  font-size: clamp(9px, 2.2vmin, 11px);
  color: #ffd23f;
  letter-spacing: 1px;
  white-space: nowrap;
}
.share-box input {
  flex: 1; min-width: 0;
  border-radius: 8px;
  border: 1px solid rgba(159,216,255,0.35);
  background: rgba(10,10,25,0.8);
  color: #9fd8ff;
  font-family: inherit;
  font-size: clamp(9px, 2.2vmin, 11px);
  padding: 5px 7px;
  text-overflow: ellipsis;
}
.mbtn.small {
  flex: 0 0 auto;
  min-height: 30px;
  width: auto;
  padding: 0 12px;
  font-size: clamp(11px, 2.6vmin, 13px);
  border-radius: 8px;
}

#lobby .mbtn { width: min(320px, 88vw); }
#lobby .mbtn.small { width: auto; }
#lobby .mbtn.ghost { min-height: 40px; }

/* ---------- 房间 BGM ---------- */
.bgm-bar {
  display: flex; align-items: center; gap: 6px;
  margin-top: 6px;
  padding: 6px 8px;
  border-radius: 8px;
  background: rgba(255,210,63,0.08);
  border: 1px solid rgba(255,210,63,0.25);
}
.bgm-bar.hidden { display: none; }
.bgm-bar .bgm-label {
  flex: 0 0 auto;
  font-size: clamp(9px, 2.2vmin, 11px);
  color: #ffd23f;
  letter-spacing: 1px;
  white-space: nowrap;
}
.bgm-bar input {
  flex: 1; min-width: 0;
  border-radius: 6px;
  border: 1px solid rgba(255,210,63,0.3);
  background: rgba(10,10,25,0.8);
  color: #fff5d0;
  font-family: inherit;
  font-size: clamp(9px, 2.2vmin, 11px);
  padding: 4px 6px;
}
.bgm-bar input::placeholder { color: #666c90; }
.bgm-bar .mbtn { min-height: 26px; padding: 0 10px; }
.bgm-bar .file-input { display: none; }
/* 单人模式：菜单内独立 BGM 栏 */
#menu .bgm-bar { width: min(320px, 88vw); margin-top: 12px; }

.bgm-now {
  display: flex; align-items: center; gap: 6px;
  margin-top: 4px;
  font-size: clamp(9px, 2.2vmin, 11px);
  color: #9fdba0;
  letter-spacing: 1px;
}
.bgm-now.hidden { display: none; }
.bgm-now-icon { animation: bgm-pulse 1.2s ease-in-out infinite; }
@keyframes bgm-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* HUD 音乐开关按钮 */
.bgm-mute {
  position: absolute;
  top: 10px; right: 56px;
  z-index: 35;              /* 高于菜单/大厅/结算遮罩，任何界面下都能开关音乐 */
  width: 36px; height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(15,15,35,0.7);
  color: #ffd23f;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.bgm-mute:hover { background: rgba(255,210,63,0.2); }
.bgm-mute.muted { color: #666c90; }
.bgm-mute.hidden { display: none; }

.hint { font-size: clamp(9px, 2.2vmin, 12px); color: #9aa0c0; max-width: 90vw; }
.hint.dim { color: #666c90; }

/* ---------- Toast ---------- */
#toast {
  position: absolute;
  left: 50%; bottom: max(20%, 120px);
  transform: translateX(-50%);
  z-index: 40;
  background: rgba(20,20,40,0.92);
  border: 2px solid rgba(255,210,63,0.6);
  color: #ffd23f;
  font-size: clamp(11px, 2.8vmin, 14px);
  padding: 10px 18px;
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ---------- 桌面端居中优化 ---------- */
@media (hover: hover) and (pointer: fine) {
  #app {
    left: 50%; transform: translateX(-50%);
    width: min(100vw - 32px, 1180px);
    border-left: 2px solid #1a1a2e;
    border-right: 2px solid #1a1a2e;
  }
}

/* ---------- 技能选择卡 ---------- */
#skill-pick { z-index: 27; gap: 14px; }
.skill-title {
  font-size: clamp(18px, 5vmin, 28px);
  letter-spacing: 4px;
  color: #62c8ff;
  text-shadow: 0 0 12px rgba(98,200,255,0.6);
}
.skill-sub {
  font-size: clamp(10px, 2.6vmin, 13px);
  color: #9fd8ff;
  letter-spacing: 1px;
}
.skill-cards {
  display: flex;
  flex-direction: row;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 92vw;
}
.skill-card {
  width: clamp(95px, 26vw, 160px);
  min-height: clamp(120px, 32vw, 180px);
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.2);
  background: rgba(15,15,35,0.92);
  display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 10px 8px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.skill-card:hover, .skill-card:active {
  transform: translateY(-4px) scale(1.03);
  border-color: var(--skill-color, #4fd8ff);
  box-shadow: 0 0 16px var(--skill-glow, rgba(79,216,255,0.4));
}
.skill-card .skill-icon {
  font-size: clamp(28px, 8vmin, 44px);
  line-height: 1;
  filter: drop-shadow(0 0 6px var(--skill-glow, rgba(79,216,255,0.5)));
}
.skill-card .skill-name {
  font-size: clamp(11px, 3vmin, 15px);
  font-weight: bold;
  color: var(--skill-color, #4fd8ff);
  letter-spacing: 1px;
  text-align: center;
}
.skill-card .skill-desc {
  font-size: clamp(8px, 2vmin, 11px);
  color: #aab0d0;
  text-align: center;
  line-height: 1.4;
  flex: 1;
}
.skill-card .skill-tag {
  font-size: clamp(7px, 1.8vmin, 9px);
  color: #666c90;
  letter-spacing: 1px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
}
.skill-card.random .skill-icon { animation: skillSpin 2s ease-in-out infinite; }
@keyframes skillSpin {
  0%,100% { transform: rotate(0deg) scale(1); }
  50% { transform: rotate(180deg) scale(1.15); }
}
.skill-card.selected {
  border-color: var(--skill-color, #4fd8ff);
  box-shadow: 0 0 20px var(--skill-glow, rgba(79,216,255,0.6));
  transform: translateY(-2px) scale(1.04);
}
.skill-card.selected::after {
  content: '✓ 已选择';
  position: absolute;
  top: 4px; right: 6px;
  font-size: 9px;
  color: #38d47a;
  font-weight: bold;
}
.skill-timer-bar {
  width: min(280px, 70vw);
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
}
.skill-timer-fill {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #4fd8ff, #ffd23f);
  border-radius: 2px;
  transition: width 0.1s linear;
}
.skill-hint {
  font-size: clamp(9px, 2.2vmin, 12px);
  color: #7a7aa8;
  text-align: center;
}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <!-- HUD：我的血条 / 房间码 / 其他玩家血条列表 -->
    <div id="hud">
      <div class="fighter me">
        <div class="row"><span class="name" id="name-me">你</span><span class="buff" id="buff-me"></span></div>
        <div class="hpbar"><div class="hpfill me" id="hp-me"></div></div>
        <div class="wep" id="wep-me">拳刃</div>
      </div>
      <div class="mid">
        <div class="room" id="room-tag"></div>
        <div class="vs">VS</div>
      </div>
      <div id="others"></div>
    </div>

    <button id="btn-menu" title="返回菜单">≡</button>
    <button id="btn-bgm-mute" class="bgm-mute hidden" title="音乐开关">♪</button>

    <!-- 移动端虚拟按键（触屏自动显示） -->
    <div id="touch">
      <div class="pad left">
        <button class="tbtn move" data-act="left">◀</button>

/* 种子随机数生成器（房主生成种子，各端生成完全相同的地图） */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
/* 射线与 AABB 求交：返回命中距离 t，未命中返回 null */
function rayAABB(x, y, dx, dy, b) {
  let tmin = 0, tmax = 1e9;
  if (Math.abs(dx) < 1e-6) { if (x < b.x || x > b.x + b.w) return null; }
  else {
    let t1 = (b.x - x) / dx, t2 = (b.x + b.w - x) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return null;
  }
  if (Math.abs(dy) < 1e-6) { if (y < b.y || y > b.y + b.h) return null; }
  else {
    let t1 = (b.y - y) / dy, t2 = (b.y + b.h - y) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    if (tmin > tmax) return null;
  }
  return tmin >= 0 ? tmin : null;
}

}

<script>
/* ===== js/input.js ===== */
'use strict';
/* ================= 输入层：键盘 + 触摸虚拟按键 ================= */

const KEYMAP = {
  left:   ['KeyA', 'ArrowLeft'],
  right:  ['KeyD', 'ArrowRight'],
  jump:   ['KeyW', 'ArrowUp', 'Space'],
  attack: ['KeyJ', 'KeyF', 'KeyL'],
  block:  ['KeyK', 'KeyS', 'ArrowDown'],
};

class KeyInput {
  constructor() {
    this.down = new Set();
    this.pressed = new Set();
    addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      this.down.add(e.code);
      this.pressed.add(e.code);
    });
    addEventListener('keyup', (e) => this.down.delete(e.code));
    addEventListener('blur', () => this.down.clear());
  }
  anyDown(codes) { return codes.some((c) => this.down.has(c)); }
  anyPressed(codes) {
    let hit = false;
    for (const c of codes) if (this.pressed.has(c)) { this.pressed.delete(c); hit = true; }
    return hit;
  }
  consume(code) {
    if (this.pressed.has(code)) { this.pressed.delete(code); return true; }
    return false;
  }
}

class TouchInput {
  constructor() {
    this.held = { left: false, right: false, block: false };
    this.jumpDown = false;
    this.jumpEdgeFlag = false;
    this.attackEdgeFlag = false;
    this._safetyTimer = null;
    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) document.body.classList.add('touch');

    // 全局 stage 级 pointerup/cancel：防止手指滑出按钮后无法释放
    const stage = document.getElementById('stage');
    stage.addEventListener('pointerup', () => this._releaseAll());
    stage.addEventListener('pointercancel', () => this._releaseAll());

    document.querySelectorAll('#touch .tbtn').forEach((btn) => {
      const act = btn.dataset.act;
      const dn = (e) => {
        e.preventDefault();
        if (btn.setPointerCapture) { try { btn.setPointerCapture(e.pointerId); } catch (err) {} }
        btn.classList.add('on');
        if (act === 'jump') { this.jumpEdgeFlag = true; this.jumpDown = true; }
        else if (act === 'attack') this.attackEdgeFlag = true;
        else if (act in this.held) this.held[act] = true;
        this._resetSafetyTimer();
      };
      const up = (e) => {
        if (e && e.cancelable) e.preventDefault();
        btn.classList.remove('on');
        if (act === 'jump') this.jumpDown = false;
        if (act in this.held) this.held[act] = false;
        this._resetSafetyTimer();
      };
      btn.addEventListener('pointerdown', dn);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointercancel', up);
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
    });
    stage.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /* 安全释放：2.5 秒内无 pointerup 则强制释放所有按键，防止卡键 */
  _releaseAll() {
    this.held.left = false;
    this.held.right = false;
    this.held.block = false;
    this.jumpDown = false;
    document.querySelectorAll('#touch .tbtn.on').forEach((b) => b.classList.remove('on'));
    if (this._safetyTimer) { clearTimeout(this._safetyTimer); this._safetyTimer = null; }
  }
  _resetSafetyTimer() {
    if (this._safetyTimer) clearTimeout(this._safetyTimer);
    this._safetyTimer = setTimeout(() => this._releaseAll(), 2500);
  }
}

/* 统一本地输入：每帧 poll 出一个 InputState */
class LocalInput {
  constructor() { this.k = new KeyInput(); this.t = new TouchInput(); }
  poll() {
    const k = this.k, t = this.t;
    const s = {
      left:  k.anyDown(KEYMAP.left) || t.held.left,
      right: k.anyDown(KEYMAP.right) || t.held.right,
      block: k.anyDown(KEYMAP.block) || t.held.block,
      jump:  k.anyDown(KEYMAP.jump) || t.jumpDown,
      jumpEdge: false, attackEdge: false,
    };
    if (k.anyPressed(KEYMAP.jump) || t.jumpEdgeFlag) { s.jumpEdge = true; t.jumpEdgeFlag = false; }
    if (k.anyPressed(KEYMAP.attack) || t.attackEdgeFlag) { s.attackEdge = true; t.attackEdgeFlag = false; }
    return s;
  }
}

<script>
/* ===== js/net.js ===== */
'use strict';
/* ================= 网络层（多人对战） =================
 * 传输优先级：WebSocket 中继服务器（真网络）→ BroadcastChannel（同浏览器多标签兜底）
 * 统一 Link 接口：send(obj) / onMessage / onClose / close()
 * 消息格式：{ t:类型, from:发送者id, ... }（ws 由服务器附加 from；bc 自带 from 广播）
 *
 * 协议：
 *   hello   {t,from}          新玩家加入（host 维护名单）
 *   lobby   {t,from,players}  host 广播大厅名单（[{id,name}]，第一个是 host）
 *   start   {t,from,seed,players} host 开始对战（seed 用于各端生成同一张随机地图）
 *   inp     {t,from,l,r,b,j,a} 客户端 → host 输入
 *   snap    {t,from,m,w,ko}   host → 所有人 快照
 *   ev      {t,from,k,...}    reset / end（winner）
 *   bye     {t,from}          玩家离开（bc 模式由本端发送；ws 模式由服务器发）
 */

function bcLink(room, myId) {
  const ch = new BroadcastChannel('mecha-' + room);
  const link = {
    kind: 'bc', onMessage: null, onClose: null,
    send(o) { try { ch.postMessage({ ...o, from: myId }); } catch (e) {} },
    close() {
      try { ch.postMessage({ t: 'bye', from: myId }); } catch (e) {}
      try { ch.close(); } catch (e) {}
    },
  };
  ch.onmessage = (e) => {
    const m = e.data;
    if (!m || m.from === myId) return;      // 忽略自己
    if (link.onMessage) link.onMessage(m);
  };
  return link;
}

/* 构建 WebSocket URL（反向代理兼容）：
 * - 保留页面 URL 上已有的查询参数（如反向代理的端口路由参数 _port=xxxx）
 * - 以页面路径的目录为基准（支持子路径部署，如 https://host/game/）
 * - https 页面自动用 wss */
function buildWsUrl(room, myId) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const dir = location.pathname.replace(/[^/]*$/, '');
  const params = new URLSearchParams(location.search);
  params.set('room', room);
  params.set('id', myId);
  return proto + '//' + location.host + dir + '?' + params.toString();
}

function wsLink(room, myId) {
  return new Promise((resolve) => {
    let ws, done = false;
    const fallback = () => {
      if (done) return;
      done = true;
      try { if (ws) ws.close(); } catch (e) {}
      resolve(bcLink(room, myId));
    };
    try {
      ws = new WebSocket(buildWsUrl(room, myId));
    } catch (e) { return fallback(); }
    const timer = setTimeout(fallback, 1600);
    ws.onopen = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      const link = {
        kind: 'ws', onMessage: null, onClose: null,
        send(o) { try { ws.send(JSON.stringify({ ...o, from: myId })); } catch (e) {} },
        close() { try { ws.close(); } catch (e) {} },
      };
      ws.onmessage = (e) => {
        let m = null;
        try { m = JSON.parse(e.data); } catch (err) {}
        if (m && link.onMessage) link.onMessage(m);
      };
      ws.onclose = () => { if (link.onClose) link.onClose(); };
      ws.onerror = () => { if (link.onClose) link.onClose(); };
      resolve(link);
    };
    ws.onerror = () => fallback();
    ws.onclose = () => fallback();
  });
}

async function connectNet(room, myId) {
  try { return await wsLink(room, myId); }
  catch (e) { return bcLink(room, myId); }
}

<script>
/* ===== js/world.js ===== */
'use strict';
/* ================= 场景 / 背景墙 / 随机地图生成 / 空投 / 投射物 / 特效 =================
 * 地图由种子（mulberry32）确定：房主生成种子并广播，所有客户端生成完全一致的
 * 平台布局 + 塔身结构 + 背景墙元素 + 武器点位。
 */

/* ---------- 粒子与飘字特效 ---------- */
class FX {
  constructor() { this.particles = []; this.popups = []; }
  spawn(x, y, opts) {
    this.particles.push(Object.assign({
      x, y, vx: 0, vy: 0, life: 0.4, maxLife: 0.4, size: 3, color: '#fff', gravity: 0, drag: 0.9,
    }, opts));
  }
  burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = speed * (0.4 + Math.random() * 0.8);
      this.spawn(x, y, {
        color, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.35, maxLife: 0.35, size: 1.5 + Math.random() * 2.5, gravity: 300,
      });
    }
  }
  popup(x, y, text, color) { this.popups.push({ x, y, text, color, life: 0.7, maxLife: 0.7 }); }
  update(dt) {
    for (const p of this.particles) {
      p.life -= dt; p.vy += p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= p.drag; p.vy *= p.drag;
    }
    this.particles = this.particles.filter((p) => p.life > 0);
    for (const t of this.popups) { t.life -= dt; t.y -= 24 * dt; }
    this.popups = this.popups.filter((t) => t.life > 0);
  }
  draw(ctx) {
    for (const p of this.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x - p.size / 2), Math.round(p.y - p.size / 2), p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (const t of this.popups) {
      ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- 背景墙元素（多样化装饰，地图生成的原子单位） ---------- */
const WALL_KINDS = ['panel', 'window', 'pipe', 'vent', 'screen', 'tank', 'lamp'];

const WallElem = {
  /* 铆钉金属板 */
  panel(ctx, x, y, w, h) {
    ctx.fillStyle = '#191930'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#232342'; ctx.fillRect(x + 2, y + 2, w - 4, 2);
    ctx.fillStyle = '#101024'; ctx.fillRect(x + 2, y + h - 4, w - 4, 2);
    ctx.fillStyle = '#31315c';
    ctx.fillRect(x + 3, y + 3, 2, 2);
    ctx.fillRect(x + w - 5, y + 3, 2, 2);
    ctx.fillRect(x + 3, y + h - 5, 2, 2);
    ctx.fillRect(x + w - 5, y + h - 5, 2, 2);
  },
  /* 发光窗户 */
  window(ctx, x, y, w, h, t, ph) {
    ctx.fillStyle = '#101024'; ctx.fillRect(x, y, w, h);
    const on = 0.5 + 0.5 * Math.sin(t * 1.2 + ph * 7);
    ctx.globalAlpha = 0.45 + 0.3 * on;
    ctx.fillStyle = ph % 2 < 1 ? '#3d8bff' : '#ff8f4f';
    const mw = (w - 6) / 2, mh = (h - 6) / 2;
    ctx.fillRect(x + 3, y + 3, mw - 1, mh - 1);
    ctx.fillRect(x + 4 + mw, y + 3, mw - 1, mh - 1);
    ctx.fillRect(x + 3, y + 4 + mh, mw - 1, mh - 1);
    ctx.globalAlpha = 0.85;
    ctx.fillRect(x + 4 + mw, y + 4 + mh, mw - 1, mh - 1);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#2a2a50'; ctx.fillRect(x + 2, y + h / 2 - 1, w - 4, 2);
  },
  /* 管道 */
  pipe(ctx, x, y, w, h) {
    ctx.fillStyle = '#23233f'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#33335c'; ctx.fillRect(x, y + 1, w, 2);
    ctx.fillStyle = '#14142c'; ctx.fillRect(x, y + h - 3, w, 2);
    ctx.fillStyle = '#3a3a68';
    ctx.fillRect(x + 2, y + h / 2 - 2, 4, 4);
    ctx.fillRect(x + w - 6, y + h / 2 - 2, 4, 4);
    if (h > 40) {
      ctx.fillStyle = '#2a2a4c';
      ctx.fillRect(x, y + h * 0.3, w, 3);
      ctx.fillRect(x, y + h * 0.65, w, 3);
    }
  },
  /* 通风扇（旋转动画） */
  vent(ctx, x, y, w, h, t, ph) {
    ctx.fillStyle = '#15152a'; ctx.fillRect(x, y, w, h);
    const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h) / 2 - 3;
    ctx.fillStyle = '#0c0c1a';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    const a = t * (2 + ph) + ph * 3;
    ctx.strokeStyle = '#3d3d6e'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ang = a + (i * Math.PI * 2) / 3;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85);
      ctx.stroke();
    }
    ctx.fillStyle = '#4a4a7c'; ctx.fillRect(cx - 2, cy - 2, 4, 4);
    ctx.strokeStyle = '#2a2a4e'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  },
  /* 数据大屏（闪烁） */
  screen(ctx, x, y, w, h, t, ph) {
    ctx.fillStyle = '#0c0c1c'; ctx.fillRect(x, y, w, h);
    const on = Math.sin(t * 3 + ph * 5) > -0.4;
    ctx.fillStyle = on ? '#0f4a3a' : '#0c2a24';
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    if (on) {
      ctx.fillStyle = '#2fdba0';
      for (let i = 0; i < 4; i++) {
        const bw = ((w - 8) * ((Math.sin(t * 2 + i * 1.7 + ph) + 1) / 2)) | 0;
        ctx.fillRect(x + 4, y + 5 + i * ((h - 10) / 4), Math.max(2, bw), 2);
      }
      ctx.fillStyle = '#9fffd8'; ctx.fillRect(x + 4, y + 4, 3, 2);
    }
    ctx.fillStyle = '#2a2a50'; ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2);
  },
  /* 储气罐 */
  tank(ctx, x, y, w, h) {
    ctx.fillStyle = '#1d1d38'; ctx.fillRect(x + 2, y, w - 4, h);
    ctx.fillStyle = '#2c2c52'; ctx.fillRect(x + 2, y + 1, w - 4, 2);
    ctx.fillStyle = '#111124'; ctx.fillRect(x + 2, y + h - 3, w - 4, 2);
    ctx.strokeStyle = '#34345e'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 2, y + h / 2); ctx.lineTo(x + w - 2, y + h / 2);
    ctx.moveTo(x + 2, y + h / 4); ctx.lineTo(x + w - 2, y + h / 4);
    ctx.stroke();
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + w / 2 - 2, y + h / 2 - 2, 4, 4);
    ctx.fillStyle = '#15152a'; ctx.fillRect(x, y + h * 0.2, 3, h * 0.6);
    ctx.fillRect(x + w - 3, y + h * 0.2, 3, h * 0.6);
  },
  /* 灯柱 */
  lamp(ctx, x, y, w, h, t, ph) {
    ctx.fillStyle = '#1a1a30'; ctx.fillRect(x + w / 2 - 2, y + 4, 4, h - 4);
    ctx.fillStyle = '#262644'; ctx.fillRect(x + w / 2 - 4, y, 8, 5);
    const on = 0.6 + 0.4 * Math.sin(t * 5 + ph * 9);
    ctx.globalAlpha = on;
    ctx.fillStyle = '#ffe9a0';
    ctx.fillRect(x + w / 2 - 3, y + 5, 6, 3);
    ctx.globalAlpha = on * 0.25;
    ctx.fillRect(x + w / 2 - 6, y + 8, 12, 8);
    ctx.globalAlpha = 1;
  },
};

function drawWallElem(ctx, kind, x, y, w, h, t, ph) {
  (WallElem[kind] || WallElem.panel)(ctx, x, y, w, h, t || 0, ph || 0);
}

/* ---------- 随机地图生成（种子驱动） ----------
 * 结构：分层平台（保证层间高差可二段跳抵达）+ 塔身/悬臂结构装饰 + 背景墙网格
 * 层高约束：离散物理（半隐式欧拉）下二段跳实际最大爬升 ≈117px
 * （理论 124px，积分误差 -7px），故所有层差上限设为 112px，留 5px 落台余量：
 *   地面660 → L1[548,564] 最大差 112 ✓
 *   L1 → L2[462,478] 最大差 102 ✓   L2 → L3[382,398] 最大差 96 ✓
 *   L3 → L4[298,314] 最大差 100 ✓   全部可达
 */
class GameMap {
  constructor(seed) {
    this.seed = seed >>> 0;
    this.platforms = [];   // { x, y, w } 可站立平台（单向）
    this.structs = [];     // { x, y, w, style, cells:[{kind,ox,oy,w,h,ph}] } 平台下方结构装饰
    this.pads = [];        // { x, y, weapon } 固定武器点位
    this.bgWalls = [];     // 背景墙元素（视差层）
    this.generate();
  }

  generate() {
    const R = mulberry32(this.seed);
    const W = WORLD.w;

    /* --- 分层平台生成（上层挂靠下层平台，保证整图可达） ---
     * 底层 L1 靠地面支撑（rise ≤112）；L2~L4 的每个平台挂靠一个下层平台，
     * 中心偏移 ≤130px → 与支撑平台的水平间隙 ≤ ~20px，一跳（水平漂移 ≤200px）必达。 */
    const layers = [
      { y: 556, jit: 8, n: R() < 0.5 ? 3 : 2, edge: true },    // 底层：保证两端有平台
      { y: 470, jit: 8, n: R() < 0.45 ? 3 : 2 },
      { y: 390, jit: 8, n: 2 },
      { y: 306, jit: 8, n: R() < 0.55 ? 2 : 1 },               // 顶层
    ];
    let lower = null;
    for (let li = 0; li < layers.length; li++) {
      const L = layers[li];
      const cur = [];
      for (let i = 0; i < L.n; i++) {
        const w = Math.round(110 + R() * 150);
        let cx;
        if (li === 0) {
          const seg = W / L.n;
          if (L.edge && i === 0) cx = 60 + w / 2 + R() * 40;                 // 左端
          else if (L.edge && i === L.n - 1) cx = W - 60 - w / 2 - R() * 40;  // 右端
          else cx = seg * i + seg / 2 + (R() - 0.5) * seg * 0.34;
        } else {
          /* 挂靠下层平台：间隙 ≤ ~20px */
          const sup = lower[Math.floor(i * lower.length / L.n)];
          cx = sup.x + sup.w / 2 + (R() - 0.5) * 260;
        }
        /* 层内防重叠（保持 ≥36px 间隙，可同层跳跃跨越） */
        for (let k = 0; k < 8; k++) {
          const clash = cur.find((p) => Math.abs(cx - (p.x + p.w / 2)) < (w + p.w) / 2 + 36);
          if (!clash) break;
          const cc = clash.x + clash.w / 2;
          const sgn = cx >= cc ? 1 : -1;
          cx = cc + sgn * ((w + clash.w) / 2 + 40 + R() * 30);
        }
        const x = clamp(cx - w / 2, 24, W - 24 - w);
        const y = L.y + Math.round((R() - 0.5) * L.jit);
        const plat = { x: Math.round(x), y: Math.round(y), w };
        cur.push(plat);
        this.platforms.push(plat);
      }
      lower = cur;
    }

    /* --- 每个平台生成结构装饰（塔身到地面 / 悬臂斜撑） --- */
    for (const p of this.platforms) {
      const style = R() < 0.55 ? 'tower' : 'wing';
      const cells = [];
      if (style === 'tower') {
        /* 塔身：从平台下沿铺墙元素到地面 */
        const tw = Math.max(46, p.w - 16 - Math.round(R() * 30));
        const tx = p.x + Math.round((p.w - tw) / 2);
        const th = WORLD.groundY - (p.y + 8);
        for (let cy = p.y + 12; cy < WORLD.groundY - 8; cy += 44) {
          const ch = Math.min(44, WORLD.groundY - cy - 2);
          const r = R();
          const kind = r < 0.3 ? 'panel' : r < 0.5 ? 'window' : r < 0.65 ? 'pipe'
            : r < 0.78 ? 'vent' : r < 0.88 ? 'screen' : 'tank';
          cells.push({ kind, ox: tx - p.x, oy: cy - p.y, w: tw, h: ch, ph: Math.floor(R() * 10) });
        }
      } else {
        /* 悬臂：平台下方短立柱 + 斜撑梁 */
        const pw = 12 + Math.round(R() * 8);
        const ph1 = 26 + Math.round(R() * 22);
        cells.push({ kind: 'pipe', ox: p.w * 0.2, oy: 8, w: pw, h: ph1, ph: 0 });
        cells.push({ kind: 'pipe', ox: p.w * 0.8 - pw, oy: 8, w: pw, h: ph1, ph: 1 });
        const lw = Math.round(p.w * 0.7);
        cells.push({ kind: 'beam', ox: (p.w - lw) / 2, oy: 8 + ph1 - 6, w: lw, h: 8, ph: 0 });
      }
      this.structs.push({ ...p, style, cells });
    }

    /* --- 固定武器点位：随机挑 3~5 个平台放置（不同层优先） --- */
    const pool = this.platforms.map((p, i) => ({ p, i, layer: Math.floor(i / 1) }))
      .sort(() => R() - 0.5);
    const nPads = 3 + Math.floor(R() * 3);
    const usedIdx = new Set();
    for (let k = 0; k < pool.length && this.pads.length < nPads; k++) {
      const cand = pool[k];
      if (usedIdx.has(cand.i)) continue;
      usedIdx.add(cand.i);
      const p = cand.p;
      const weapon = (this.pads.length % 2 === 0) ? 'ray' : 'plasma';
      this.pads.push({
        x: Math.round(p.x + p.w / 2 + (R() - 0.5) * p.w * 0.4),
        y: p.y, weapon,
      });
    }

    /* --- 背景墙网格（视差 0.65 层，覆盖地图全域） --- */
    const bgW = W * 0.65 + 500;
    const cell = 74;
    for (let gx = -40; gx < bgW; gx += cell) {
      for (let gy = 60; gy < WORLD.groundY - 30; gy += cell) {
        if (R() > 0.42) continue;
        const kind = WALL_KINDS[Math.floor(R() * WALL_KINDS.length)];
        const w = 30 + Math.round(R() * 26);
        const h = 30 + Math.round(R() * 30);
        this.bgWalls.push({
          kind, x: Math.round(gx + R() * 14), y: Math.round(gy + R() * 14),
          w, h, ph: Math.floor(R() * 12),
        });
      }
    }
  }

  /* 平台顶面绘制（含结构装饰，位于机甲身后） */
  drawStructures(ctx, t) {
    for (const s of this.structs) {
      /* 结构体（背景墙风格） */
      for (const c of s.cells) {
        const cx = s.x + c.ox, cy = s.y + c.oy;
        if (c.kind === 'beam') {
          ctx.fillStyle = '#20203a'; ctx.fillRect(cx, cy, c.w, c.h);
          ctx.fillStyle = '#2c2c4e'; ctx.fillRect(cx, cy, c.w, 2);
          ctx.strokeStyle = '#282848'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(s.x + 6, s.y + 12); ctx.lineTo(cx + 8, cy + 4);
          ctx.moveTo(s.x + s.w - 6, s.y + 12); ctx.lineTo(cx + c.w - 8, cy + 4);
          ctx.stroke();
        } else {
          ctx.globalAlpha = 0.9;
          drawWallElem(ctx, c.kind, cx, cy, c.w, c.h, t, c.ph);
          ctx.globalAlpha = 1;
        }
      }
      /* 平台主体：更深更有存在感 */
      ctx.fillStyle = '#2a2a4a'; ctx.fillRect(s.x - 2, s.y, s.w + 4, 12);
      /* 顶部亮边（高对比度，玩家能看清平台位置） */
      ctx.fillStyle = '#5a5a8a'; ctx.fillRect(s.x - 2, s.y, s.w + 4, 3);
      /* 金属高光 */
      ctx.fillStyle = '#7878b8'; ctx.fillRect(s.x - 2, s.y, s.w + 4, 1);
      /* 底部暗边 */
      ctx.fillStyle = '#1a1a32'; ctx.fillRect(s.x - 2, s.y + 10, s.w + 4, 2);
      /* 铆钉装饰 */
      ctx.fillStyle = '#6a6a9a';
      for (let rx = s.x + 8; rx < s.x + s.w - 4; rx += 28) {
        ctx.fillRect(rx, s.y + 5, 3, 3);
      }
      /* 平台底部悬挂装饰线条 */
      ctx.fillStyle = '#33335a';
      ctx.fillRect(s.x, s.y + 12, s.w, 2);
    }
  }

  /* 背景墙（视差层） */
  drawBgWalls(ctx, cam, t) {
    const off = cam.x * 0.65, offY = cam.y * 0.5;
    ctx.save();
    ctx.translate(-Math.round(off), -Math.round(offY));
    ctx.globalAlpha = 0.55;
    for (const w of this.bgWalls) {
      drawWallElem(ctx, w.kind, w.x, w.y, w.w, w.h, t, w.ph);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/* ---------- 游戏世界（多机甲） ---------- */
class World {
  constructor(game, map) {
    this.game = game;
    this.map = map;
    this.drops = [];   // 空投箱
    this.projs = [];   // 等离子投射物
    this.beams = [];   // 光线枪射线
    this.pads = map.pads.map((p) => ({ ...p, timer: 0 }));
    this.spawnT = rand(3, 6);
  }

  get platforms() { return this.map.platforms; }

  /* 空投箱落地高度检测（py→ny 之间是否落在平台顶或地面） */
  dropLandY(x, py, ny) {
    if (ny >= WORLD.groundY) return WORLD.groundY;
    for (const pl of this.map.platforms) {
      if (x > pl.x && x < pl.x + pl.w && py <= pl.y && ny >= pl.y) return pl.y;
    }
    return null;
  }

  spawnDrop() {
    const r = Math.random();
    let content;
    if (r < 0.45) content = { kind: 'weapon', id: choice(['ray', 'plasma']) };
    else if (r < 0.75) content = { kind: 'item', id: 'medkit' };
    else if (r < 0.9) content = { kind: 'item', id: 'shield' };
    else content = { kind: 'item', id: 'boost' };
    this.drops.push({ x: rand(80, WORLD.w - 80), y: -16, vy: 0, landed: false, life: 12, content });
  }

  applyDrop(m, d, fx) {
    const c = d.content;
    if (c.kind === 'weapon') {
      m.equip(WEAPONS[c.id]);
      fx.popup(m.x, m.y - 52, WEAPONS[c.id].name + '!', '#9fe8ff');
    } else {
      const it = ITEMS[c.id];
      m.applyItem(it);
      fx.popup(m.x, m.y - 52, it.name + '!', '#9fdba0');
    }
    fx.burst(d.x, d.y, '#ffd23f', 8, 90);
    /* 拾取回调：轰炸机技能每次拾取空投触发一次 */
    if (m.onDropPicked) m.onDropPicked(fx);
  }

  /* 光线枪：对所有敌人求最近命中 */
  fireRay(m, enemies, fx) {
    const w = m.weapon, ox = m.x + m.facing * 17, oy = m.y - 27;
    let range = w.range;
    /* 远射：射程+50% */
    if (m.skill === 'longshot') range *= 1.5;
    let len = range, hit = null;
    for (const e of enemies) {
      if (e.dead) continue;
      const t = rayAABB(ox, oy, m.facing, 0, e.hurtbox);
      if (t != null && t < len) { len = t; hit = e; }
    }
    this.beams.push({ x1: ox, y1: oy, x2: ox + m.facing * len, y2: oy, life: 0.12, color: m.palette.weapon });
    fx.burst(ox, oy, m.palette.weapon, 4, 60);
    if (hit) {
      let dmg = w.dmg;
      if (m.skill === 'glasscannon') dmg = Math.round(dmg * 1.5);
      if (m.skill === 'laststand' && m.hp < (m._maxHp || CFG.maxHp) * 0.3) dmg = Math.round(dmg * 1.6);
      hit.takeHit(dmg, m, {});
      /* 吸血 / 神秘人士：统一结算 */
      m.onDamageDealt(hit, dmg, fx);
    }
  }

  firePlasma(m, enemies) {
    let speed = WEAPONS.plasma.speed;
    let dmg = WEAPONS.plasma.dmg;
    /* 远射：投射物速度+50% */
    if (m.skill === 'longshot') speed *= 1.5;
    /* 重炮手：投射物伤害+40% */
    if (m.skill === 'gunner') dmg = Math.round(dmg * 1.4);
    /* 玻璃大炮 */
    if (m.skill === 'glasscannon') dmg = Math.round(dmg * 1.5);
    /* 背水一战 */
    if (m.skill === 'laststand' && m.hp < (m._maxHp || CFG.maxHp) * 0.3) dmg = Math.round(dmg * 1.6);

    /* 小帮手：发射时锁定武器射程内的一名敌人，全程只追这一名 */
    const trackRange = WEAPONS.plasma.range * (m.skill === 'longshot' ? 1.5 : 1);
    let track = null;
    if (m.skill === 'homing' && enemies) {
      let bd = 1e9;
      for (const e of enemies) {
        if (e.dead) continue;
        const d = Math.hypot(e.x - m.x, (e.y - 20) - (m.y - 26));
        if (d <= trackRange && d < bd) { bd = d; track = e; }
      }
    }

    this.projs.push({
      x: m.x + m.facing * 18, y: m.y - 26,
      vx: m.facing * speed, vy: -50,
      dmg, owner: m, life: 3,
      homing: !!track, track, trackRange,
    });
  }

  update(dt, mechs, fx) {
    /* 武器点位冷却 */
    for (const p of this.pads) if (p.timer > 0) p.timer -= dt;

    /* 空投生成（幸运拾取：频率+50%） */
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      let minT = 6, maxT = 10;
      if (mechs.some((m) => m.skill === 'luckydrop')) { minT = 4; maxT = 7; }
      this.spawnT = rand(minT, maxT);
      this.spawnDrop();
    }

    /* 空投下落 / 落地 / 过期 */
    for (const d of this.drops) {
      if (!d.landed) {
        const py = d.y;
        d.vy += 400 * dt; d.y += d.vy * dt;
        const top = this.dropLandY(d.x, py, d.y);
        if (top != null) { d.y = top; d.landed = true; fx.burst(d.x, d.y, '#c9a86a', 6, 60); }
      } else d.life -= dt;
    }
    this.drops = this.drops.filter((d) => d.life > 0);

    /* 拾取：空投箱 + 武器点位 */
    for (const m of mechs) {
      if (m.dead) continue;
      /* 幸运拾取：拾取范围提升到 32px */
      const pickRange = m.skill === 'luckydrop' ? 32 : 16;
      for (const d of this.drops) {
        if (d.got) continue;
        if (Math.abs(m.x - d.x) < pickRange && Math.abs((m.y - 20) - d.y) < 26) {
          d.got = true; this.applyDrop(m, d, fx);
        }
      }
      this.drops = this.drops.filter((d) => !d.got);
      for (const p of this.pads) {
        if (p.timer > 0) continue;
        if (Math.abs(m.x - p.x) < 20 && Math.abs(m.y - p.y) < 8) {
          p.timer = 12;
          const w = WEAPONS[p.weapon];
          m.equip(w);
          fx.popup(m.x, m.y - 52, w.name + '!', '#9fe8ff');
          fx.burst(m.x, m.y - 8, '#4fd8ff', 8, 80);
        }
      }
    }

    /* 投射物（命中所有非 owner 机甲） */
    for (const pr of this.projs) {
      /* 小帮手：只追踪发射时锁定的那一目标；目标死亡或超出射程则失效 */
      if (pr.homing && pr.track) {
        if (pr.track.dead || Math.hypot(pr.track.x - pr.x, (pr.track.y - 20) - pr.y) > pr.trackRange) {
          pr.homing = false; pr.track = null;
        } else {
          const dx = pr.track.x - pr.x, dy = (pr.track.y - 20) - pr.y;
          const dist = Math.hypot(dx, dy) || 1;
          const sp = Math.hypot(pr.vx, pr.vy) || 1;
          pr.vx += (dx / dist) * 520 * dt;
          pr.vy += (dy / dist) * 520 * dt;
          const ns = Math.hypot(pr.vx, pr.vy);
          if (ns > sp * 1.1) { pr.vx = (pr.vx / ns) * sp * 1.1; pr.vy = (pr.vy / ns) * sp * 1.1; }
        }
      }
      pr.vy += 260 * dt; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
      let boom = false;
      if (pr.x < 0 || pr.x > WORLD.w || pr.y > WORLD.groundY) boom = true;
      if (!boom) for (const pl of this.map.platforms) {
        if (pr.x > pl.x && pr.x < pl.x + pl.w && pr.y > pl.y && pr.y < pl.y + 8) { boom = true; break; }
      }
      if (!boom) for (const m of mechs) {
        if (m === pr.owner || m.dead) continue;
        if (aabb({ x: pr.x - 5, y: pr.y - 5, w: 10, h: 10 }, m.hurtbox)) {
          m.takeHit(pr.dmg, pr.owner, {});
          /* 吸血 / 神秘人士：轰炸机炸弹不属于武器，不触发 */
          if (!pr.bomb && pr.owner && pr.owner.onDamageDealt) pr.owner.onDamageDealt(m, pr.dmg, fx);
          boom = true; break;
        }
      }
      if (boom || pr.life <= 0) { pr.dead = true; fx.burst(pr.x, pr.y, '#ff9a3d', 10, 120); }
    }
    this.projs = this.projs.filter((p) => !p.dead);

    /* 射线衰减 */
    for (const b of this.beams) b.life -= dt;
    this.beams = this.beams.filter((b) => b.life > 0);
  }

  /* ---------- 绘制 ---------- */
  drawBG(ctx, cam, t) {
    if (!this._sky) {
      const g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
      g.addColorStop(0, '#0a0a1e'); g.addColorStop(1, '#1a1a3c');
      this._sky = g;
    }
    ctx.fillStyle = this._sky;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    /* 星空（视差 0.15） */
    const span = 640;
    ctx.fillStyle = '#cfe8ff';
    for (let i = 0; i < 50; i++) {
      const bx = (i * 97) % span, by = (i * 61) % 190;
      const x = ((bx - cam.x * 0.15) % span + span) % span;
      ctx.globalAlpha = 0.2 + 0.3 * (0.5 + 0.5 * Math.sin(t * 2 + i));
      ctx.fillRect(Math.round(x), Math.round(by), 2, 2);
    }
    ctx.globalAlpha = 1;

    /* 城市剪影（视差 0.35） */
    const cityY = VIEW_H * 0.62 - cam.y * 0.25;
    const off = cam.x * 0.35;
    for (let i = 0; i < 24; i++) {
      const bx = Math.round(i * 80 - (off % 1920));
      if (bx < -80 || bx > VIEW_W + 80) continue;
      const bh = 50 + ((i * 53) % 80);
      ctx.fillStyle = '#12122a';
      ctx.fillRect(bx, cityY - bh, 56, bh + 240);
      ctx.fillStyle = '#1d1d3f';
      ctx.fillRect(bx, cityY - bh, 56, 4);
      ctx.fillStyle = '#2a2a55';
      ctx.fillRect(bx + 8, cityY - bh + 10, 4, 4);
      ctx.fillRect(bx + 30, cityY - bh + 22, 4, 4);
      ctx.fillRect(bx + 44, cityY - bh + 8, 4, 4);
    }

    /* 背景墙层（视差 0.65） */
    this.map.drawBgWalls(ctx, cam, t);
  }

  draw(ctx, t) {
    /* 地面 */
    ctx.fillStyle = '#1c1c30';
    ctx.fillRect(0, WORLD.groundY, WORLD.w, WORLD.h - WORLD.groundY);
    ctx.fillStyle = '#3a3a66';
    ctx.fillRect(0, WORLD.groundY, WORLD.w, 2);
    ctx.strokeStyle = '#26263f'; ctx.lineWidth = 1;
    for (let gx = 0; gx <= WORLD.w; gx += 40) {
      ctx.beginPath(); ctx.moveTo(gx + 0.5, WORLD.groundY + 2); ctx.lineTo(gx + 0.5, WORLD.h); ctx.stroke();
    }
    for (let gy = WORLD.groundY + 8; gy < WORLD.h; gy += 8) {
      ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(WORLD.w, gy + 0.5); ctx.stroke();
    }

    /* 平台结构（含塔身装饰） */
    this.map.drawStructures(ctx, t);

    /* 武器点位 */
    for (const p of this.pads) {
      const ready = p.timer <= 0;
      const col = ready ? (p.weapon === 'ray' ? '#4fd8ff' : '#ff6bd6') : '#4a4a6a';
      ctx.fillStyle = '#15152a'; ctx.fillRect(p.x - 14, p.y - 3, 28, 5);
      ctx.fillStyle = col; ctx.fillRect(p.x - 12, p.y - 2, 24, 2);
      const bob = Math.sin(t * 3 + p.x) * 2;
      ctx.globalAlpha = ready ? 0.95 : 0.3;
      ctx.fillStyle = col;
      if (p.weapon === 'ray') {
        ctx.fillRect(p.x - 6, p.y - 15 + bob, 12, 2);
        ctx.fillRect(p.x + 4, p.y - 17 + bob, 2, 6);
      } else {
        ctx.fillRect(p.x - 3, p.y - 17 + bob, 6, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 1, p.y - 15 + bob, 2, 2);
      }
      ctx.globalAlpha = 1;
      if (!ready) {
        const r = 1 - p.timer / 12;
        ctx.fillStyle = '#22223a'; ctx.fillRect(p.x - 12, p.y - 1, 24, 2);
        ctx.fillStyle = col; ctx.fillRect(p.x - 12, p.y - 1, Math.round(24 * r), 2);
      }
    }

    /* 空投箱 */
    for (const d of this.drops) {
      if (!d.landed) {
        ctx.fillStyle = '#4fd8ff'; ctx.fillRect(d.x - 6, d.y - 26, 12, 4);
        ctx.strokeStyle = '#4fd8ff'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(d.x - 6, d.y - 24); ctx.lineTo(d.x - 4, d.y - 12);
        ctx.moveTo(d.x + 6, d.y - 24); ctx.lineTo(d.x + 4, d.y - 12);
        ctx.stroke();
      }
      let a = 1;
      if (d.landed && d.life < 3) a = 0.3 + 0.7 * Math.abs(Math.sin(t * 8));
      ctx.globalAlpha = a;
      ctx.fillStyle = '#8a6a3a'; ctx.fillRect(d.x - 7, d.y - 14, 14, 14);
      ctx.fillStyle = '#b08a4a'; ctx.fillRect(d.x - 7, d.y - 14, 14, 3);
      ctx.fillStyle = '#3a2a16'; ctx.fillRect(d.x - 7, d.y - 4, 14, 4);
      ctx.fillStyle = '#ffd23f';
      ctx.font = 'bold 9px "Courier New", monospace'; ctx.textAlign = 'center';
      ctx.fillText('?', d.x, d.y - 4);
      ctx.globalAlpha = 1;
    }

    /* 等离子投射物 */
    for (const p of this.projs) {
      for (let k = 1; k <= 3; k++) {
        ctx.globalAlpha = 0.4 / k;
        ctx.fillStyle = '#ff9a3d';
        ctx.fillRect(p.x - p.vx * 0.015 * k - 2, p.y - p.vy * 0.015 * k - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff9a3d'; ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      ctx.fillStyle = '#fff'; ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
    }

    /* 光线枪射线 */
    for (const b of this.beams) {
      const a = Math.max(0, b.life / 0.12);
      const x = Math.min(b.x1, b.x2), w = Math.abs(b.x2 - b.x1);
      ctx.globalAlpha = a * 0.45; ctx.fillStyle = b.color; ctx.fillRect(x, b.y1 - 2, w, 4);
      ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.fillRect(x, b.y1 - 1, w, 2);
      ctx.globalAlpha = a * 0.8; ctx.fillStyle = b.color; ctx.fillRect(b.x1 - 3, b.y1 - 3, 6, 6);
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- 网络序列化（平台由种子生成，不传输） ---------- */
  serialize() {
    return {
      drops: this.drops.map((d) => ({ x: Math.round(d.x), y: Math.round(d.y), l: d.landed ? 1 : 0, life: +d.life.toFixed(1), c: d.content })),
      projs: this.projs.map((p) => ({ x: Math.round(p.x), y: Math.round(p.y), vx: Math.round(p.vx), vy: Math.round(p.vy), d: p.dmg, o: p.owner ? p.owner.id : '', life: +p.life.toFixed(1), b: p.bomb ? 1 : 0 })),
      pads: this.pads.map((p) => +Math.max(0, p.timer).toFixed(1)),
      beams: this.beams.map((b) => [Math.round(b.x1), Math.round(b.y1), Math.round(b.x2), Math.round(b.y2), +b.life.toFixed(2), b.color]),
    };
  }
  applySnap(s, mechsById) {
    this.drops = s.drops.map((d) => ({ x: d.x, y: d.y, landed: !!d.l, life: d.life, vy: 0, content: d.c }));
    this.projs = s.projs.map((p) => ({
      x: p.x, y: p.y, vx: p.vx, vy: p.vy, dmg: p.d, life: p.life,
      owner: mechsById[p.o] || null,
      bomb: !!p.b,
    }));
    this.pads.forEach((p, i) => { p.timer = s.pads[i] || 0; });
    this.beams = s.beams.map((b) => ({ x1: b[0], y1: b[1], x2: b[2], y2: b[3], life: b[4], color: b[5] || '#eaf6ff' }));
  }
}

</script>
<script>
/* ===== js/mecha.js ===== */
'use strict';
/* ================= 机甲实体：状态机 / 二段跳 / 下跳 / 多敌人 / 像素绘制 ================= */

class Mecha {
  /* id：唯一标识（网络对战用于同步）；idx：配色索引 */
  constructor(game, id, idx) {
    this.game = game;
    this.id = id;
    this.name = 'P' + (idx + 1);
    this.idx = idx;
    this.palette = PALETTES[idx % PALETTES.length];
    this.animT = Math.random() * 9;
    this.reset(200, 1);
  }

  reset(x, facing) {
    this.x = x; this.y = WORLD.groundY;
    this.vx = 0; this.vy = 0; this.facing = facing;
    this.hp = CFG.maxHp;
    this.onGround = true; this.jumps = 0;
    this.state = 'idle'; this.stateTime = 0; this.walkPhase = 0;
    this.hitstun = 0; this.cooldown = 0; this.meleeHit = false;
    this.dropT = 0;
    this.dead = false;
    this.weapon = WEAPONS.blade; this.ammo = 0;
    this.buffs = { shield: 0, boost: 0 };
    this._lastHp = CFG.maxHp;
    this._tx = null; this._ty = null;
    this._koFall = false;  // KO 倒地动画
    /* 技能状态 */
    this.skill = null;            // 技能ID
    this._flyT = 0;               // 飞行计时器（飞鼠）
    this._jumpHoldT = 0;          // 跳跃键长按时间（飞鼠）
    this._medikitUsed = 0;        // 随身血包使用次数
    this._escapeUsed = false;     // 溜之大吉是否已触发
    this._reviveUsed = false;     // 复活图腾是否已使用
    this._invincibleT = 0;        // 无敌时间
    this._pet = null;             // 宠物（驯兽大师）
    this._hoverT = 0;            // 飞鼠：悬空剩余时间
    this._slowFall = false;      // 飞鼠：悬空结束后的缓降状态
    this._flyUsed = false;       // 飞鼠：本次滞空是否已触发
    this._tapTimes = [];         // 飞鼠：空中连点跳跃的时间点
    this._ascending = false;     // 飞鼠：飞升阶段
    this._jumpPending = false;   // 飞鼠：地面按下待起跳（松开才跳）
    this._airJumpPending = false;// 飞鼠：空中按下待判定（松手二段跳/按住悬空）
    this._airHoldT = 0;          // 飞鼠：空中按住时长
    this._airPeakY = WORLD.groundY;  // 震荡波：本次腾空的最高点（y 最小值）
  }

  /* 应用技能被动效果（在 newRound 时调用） */
  applySkill() {
    const s = this.skill;
    if (!s) return;
    switch (s) {
      case 'glasscannon': this.hp = 75; this._maxHp = 75; break;
      case 'ironhide': this._maxHp = CFG.maxHp; break;
      default: this._maxHp = CFG.maxHp; break;
    }
  }

  get hurtbox() { return { x: this.x - 9, y: this.y - 40, w: 18, h: 40 }; }

  equip(w) {
    this.weapon = w;
    let ammo = w.ammo || 0;
    /* 精打细算：射击次数+3~5 */
    if (this.skill === 'thrifty' && ammo > 0) {
      ammo += 3 + Math.floor(Math.random() * 3);  // +3~5
    }
    /* 小帮手：仅对抛射物武器生效，射击次数-60% */
    if (this.skill === 'homing' && ammo > 0 && w.type === 'proj') {
      ammo = Math.max(1, Math.round(ammo * 0.4));
    }
    this.ammo = ammo;
  }

  /* 拾取补给后的技能回调（轰炸机：每次拾取空投触发一次） */
  onDropPicked(fx) {
    if (this.dead) return;
    if (this.skill === 'bomber') this._spawnBomber(this.game);
  }

  applyItem(it) {
    let heal = it.heal || 0;
    let dur = it.dur || 0;
    /* 能量控制：护盾持续时间+27%~40% */
    if (this.skill === 'energy_ctrl' && it.id === 'shield') {
      dur *= (1.27 + Math.random() * 0.13);
    }
    if (heal) this.hp = Math.min(this._maxHp || CFG.maxHp, this.hp + heal);
    if (dur) this.buffs[it.id === 'shield' ? 'shield' : 'boost'] = dur;
  }

  /* enemies：同场所有其他机甲（数组） */
  update(dt, inp, enemies) {
    const g = this.game, fx = g.fx;
    this.animT += dt;
    this.cooldown = Math.max(0, this.cooldown - dt);
    this.buffs.shield = Math.max(0, this.buffs.shield - dt);
    this.buffs.boost = Math.max(0, this.buffs.boost - dt);
    this._invincibleT = Math.max(0, this._invincibleT - dt);

    /* 技能：随身血包 — 血量低于一半时恢复 */
    if (this.skill === 'medipack' && !this.dead && this._medikitUsed < 2) {
      if (this.hp < (this._maxHp || CFG.maxHp) / 2) {
        const heal = Math.round((this._maxHp || CFG.maxHp) / 4);
        this.hp = Math.min(this._maxHp || CFG.maxHp, this.hp + heal);
        this._medikitUsed++;
        fx.popup(this.x, this.y - 52, '+' + heal + ' 随身血包', '#38d47a');
        fx.burst(this.x, this.y - 24, '#38d47a', 12, 100);
      }
    }

    /* 技能：溜之大吉 — 血量≤5%时随机传送 */
    if (this.skill === 'escape' && !this.dead && !this._escapeUsed) {
      if (this.hp <= (this._maxHp || CFG.maxHp) * 0.05 && this.hp > 0) {
        this._escapeUsed = true;
        const oldX = this.x;
        this.x = rand(80, WORLD.w - 80);
        this.y = WORLD.groundY;
        this.vx = 0; this.vy = 0;
        fx.burst(oldX, this.y - 24, '#a08fff', 16, 140);
        fx.burst(this.x, this.y - 24, '#a08fff', 16, 140);
        fx.popup(this.x, this.y - 52, '传送！', '#a08fff');
      }
    }

    /* 技能：飞鼠
     * - 地面按住跳跃 0.8s：飞升到场上最高处后悬空
     * - 地面轻点：普通跳跃（松手触发）
     * - 空中轻点：二段跳（松手触发）
     * - 空中按住 0.3s：就地悬空（保留二段跳，不抢输入）
     * - 空中 0.9s 内连点 3 次：就地悬空 */
    if (this.skill === 'flysquirrel' && !this.dead) {
      const t = this.game.time || 0;
      if (this.onGround) {
        this._ascending = false;
        this._airHoldT = 0;
        this._airJumpPending = false;
        if (inp.jump) {
          this._jumpHoldT += dt;
          if (this._jumpHoldT >= 0.8) { this._jumpPending = false; this._startAscent(fx); }
        } else {
          if (this._jumpPending) { this._jumpPending = false; this._doJump(fx); }
          this._jumpHoldT = 0;
        }
      } else {
        this._jumpPending = false;
        this._jumpHoldT = 0;
        if (inp.jumpEdge) {
          this._tapTimes.push(t);
          this._airJumpPending = true;
          this._airHoldT = 0;
        }
        if (this._airJumpPending) {
          if (inp.jump) {
            this._airHoldT += dt;
            if (this._airHoldT >= 0.3) {          // 按住 → 就地悬空
              this._airJumpPending = false;
              this._startHover(fx);
            }
          } else {                                 // 松手 → 二段跳
            this._airJumpPending = false;
            this._doDoubleJump(fx);
          }
        }
        this._tapTimes = this._tapTimes.filter((x) => t - x <= 0.9);
        if (this._hoverT <= 0 && !this._ascending && !this._flyUsed && this._tapTimes.length >= 3) {
          this._startHover(fx);                    // 连点三次 → 悬空
        }
      }
      /* 飞行粒子 */
      if ((this._hoverT > 0 || this._ascending) && Math.random() < 0.3) {
        fx.spawn(this.x - this.facing * 8, this.y - 6, {
          color: '#38d47a', vx: rand(-20, 20), vy: rand(10, 40),
          life: 0.3, maxLife: 0.3, size: 2,
        });
      }
    }

    /* 技能：驯兽大师 — 召唤宠物 */
    if (this.skill === 'beastmaster' && !this.dead && !this._pet) {
      const petHp = Math.round((this._maxHp || CFG.maxHp) * 2 / 3);
      this._pet = {
        x: this.x, y: this.y, hp: petHp, maxHp: petHp,
        cooldown: 0, facing: this.facing,
        state: 'idle', stateTime: 0, animT: 0, vy: 0, onGround: true,
      };
      fx.burst(this.x, this.y - 12, '#38d47a', 14, 120);
      fx.popup(this.x, this.y - 52, '召唤宠物！', '#38d47a');
    }
    /* 宠物AI（仅权威端 bot/net-host 运行；客户端走快照插值） */
    if (this._pet && this.game.mode !== 'net-client') {
      this._updatePet(dt, enemies, g, fx);
    }

    /* KO 动画：倒地下落，直到碰到地面或平台 */
    if (this.dead) {
      this.vy += CFG.gravity * 1.2 * dt;
      this.y += this.vy * dt;
      if (this.y >= WORLD.groundY) { this.y = WORLD.groundY; this.vy = 0; }
      else {
        for (const p of g.world.platforms) {
          if (this.x > p.x - 8 && this.x < p.x + p.w + 8 &&
              this.y >= p.y && this.y - this.vy * dt <= p.y + 1) {
            this.y = p.y; this.vy = 0;
          }
        }
      }
      this.stateTime += dt;
      return;
    }

    if (this.hitstun > 0) this.hitstun -= dt;
    if (this.state === 'hit' && this.hitstun <= 0) this.state = 'idle';

    /* 面向最近存活敌人 */
    let nearest = null, nd = 1e9;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = Math.abs(e.x - this.x);
      if (d < nd) { nd = d; nearest = e; }
    }
    if (nearest) this.facing = nearest.x >= this.x ? 1 : -1;

    /* 攻击输入（按当前武器类型分流） */
    if (inp.attackEdge && this.cooldown <= 0 && this.state !== 'hit') {
      const w = this.weapon;
      if (w.type === 'melee') {
        this.state = 'attack'; this.stateTime = 0; this.meleeHit = false;
        /* 快速装填对近战武器无效 */
        this.cooldown = w.cooldown; this.vx *= 0.3;
      } else if (this.ammo > 0) {
        let cd = w.cooldown;
        /* 快速装填 */
        if (this.skill === 'quickload') cd *= 0.65;
        /* 重炮手：冷却+20% */
        if (this.skill === 'gunner') cd *= 1.2;
        this.cooldown = cd;
        /* 如有神助：概率不消耗次数 */
        if (this.skill === 'divine_aid' && Math.random() < 0.25) {
          fx.popup(this.x, this.y - 48, '神助！', '#38d47a');
        } else {
          this.ammo--;
        }
        if (w.type === 'ray') g.world.fireRay(this, enemies, fx);
        else g.world.firePlasma(this, enemies);
        if (this.ammo <= 0) {
          fx.popup(this.x, this.y - 52, '弹药耗尽', '#ffb14f');
          this.weapon = WEAPONS.blade;
        }
      } else {
        this.weapon = WEAPONS.blade;
        this.state = 'attack'; this.stateTime = 0; this.meleeHit = false;
        this.cooldown = WEAPONS.blade.cooldown;
      }
    }

    const canAct = this.state !== 'attack' && this.state !== 'hit' && this.hitstun <= 0;
    const blocking = inp.block && this.onGround && canAct;

    /* 水平移动：更流畅的加速/减速 */
    if (canAct) {
      let dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      if (blocking) dir = 0;
      let spdMult = this.buffs.boost > 0 ? 1.45 : 1;
      /* 疾风步：速度+25% */
      if (this.skill === 'swift') spdMult *= 1.25;
      const sp = CFG.maxSpeed * spdMult;
      if (dir !== 0) this.vx = clamp(this.vx + dir * CFG.accel * dt, -sp, sp);
      else {
        const f = CFG.friction * 1.4 * dt;  /* 更强摩擦，停止更快 */
        this.vx = Math.abs(this.vx) <= f ? 0 : this.vx - Math.sign(this.vx) * f;
      }
    } else {
      this.vx *= 0.92;  /* 平滑减速，无卡顿感 */
    }

    /* 跳跃（支持二段跳）/ 下跳：站在平台上时按 下防+跳 直接穿落到下方 */
    if (inp.jumpEdge && canAct) {
      const plats = g.world.platforms;
      if (blocking && this.onGround && this.y < WORLD.groundY - 1 &&
          plats.some((p) => Math.abs(this.y - p.y) < 1 && this.x > p.x - 8 && this.x < p.x + p.w + 8)) {
        this.dropT = 0.22; this.onGround = false; this.jumps = 1;
        this.vy = 90;
        fx.burst(this.x, this.y, '#8899bb', 5, 60);
      } else if (!blocking) {
        let jumpS = CFG.jumpSpeed, jump2S = CFG.jump2Speed;
        /* 疾风步：跳跃高度+15% */
        if (this.skill === 'swift') { jumpS *= 1.15; jump2S *= 1.15; }
        if (this.onGround) {
          if (this.skill === 'flysquirrel') {
            /* 飞鼠：地面按下不立即起跳，松开才跳；按住 0.8s 触发飞升（见技能逻辑） */
            this._jumpPending = true;
          } else {
            this.vy = -jumpS; this.jumps = 1; this.onGround = false;
            fx.burst(this.x, this.y, '#8899bb', 5, 60);
          }
        } else if (this.jumps < 2) {
          /* 飞鼠：空中按键留给"连点三次悬空"判定，绝不触发二段跳 */
          if (this.skill !== 'flysquirrel') {
            this.vy = -jump2S; this.jumps = 2;
            fx.burst(this.x, this.y - 8, this.palette.shield, 8, 90);
          }
        }
      }
    }

    /* 物理 + 平台/地面碰撞（单向平台；下跳期间忽略平台） */
    const prevY = this.y;
    this.dropT = Math.max(0, this.dropT - dt);
    /* 飞鼠：飞升 / 悬空期间不受重力，只能左右移动 */
    const ascending = this.skill === 'flysquirrel' && this._ascending;
    const hovering = this.skill === 'flysquirrel' && this._hoverT > 0 && !this.onGround;
    if (ascending) {
      /* 飞升到场上最高处（顶部留 40px）后转入悬空 */
      this.vy = -520;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (this.y <= FLY_TOP_Y) {
        this.y = FLY_TOP_Y;
        this._ascending = false;
        this.vy = 0;
        this._hoverT = 4;
      }
    } else if (hovering) {
      this._hoverT = Math.max(0, this._hoverT - dt);
      this.vy = 0;
      this.x += this.vx * dt;
      if (this._hoverT <= 0) this._slowFall = true;   // 悬空结束 → 缓降
    } else {
      this.vy += CFG.gravity * dt;
      /* 飞鼠缓降：限制最大下落速度 */
      if (this.skill === 'flysquirrel' && this._slowFall && this.vy > 70) this.vy = 70;
      this.x += this.vx * dt; this.y += this.vy * dt;
    }
    let landed = false;
    if (!ascending && !hovering && this.vy >= 0) {
      if (this.y >= WORLD.groundY) { this.y = WORLD.groundY; landed = true; }
      else if (this.dropT <= 0) for (const p of g.world.platforms) {
        if (this.x > p.x - 8 && this.x < p.x + p.w + 8 && prevY <= p.y + 0.01 && this.y >= p.y) {
          this.y = p.y; landed = true; break;
        }
      }
    }
    if (landed) {
      const wasAir = !this.onGround;
      if (wasAir) fx.burst(this.x, this.y, '#8899bb', 6, 70);
      /* 震荡波：从空中落地时释放冲击波，落差越大范围与击退越强 */
      if (wasAir && this.skill === 'shockwave') {
        const drop = Math.max(0, this.y - this._airPeakY);
        if (drop > 24) {
          const radius = Math.min(220, 60 + drop * 0.7);
          const push = Math.min(420, 180 + drop * 1.4);
          const lift = Math.min(320, 90 + drop * 0.8);
          for (const e of g.mechs || []) {
            if (e === this || e.dead) continue;
            if (Math.abs(e.x - this.x) <= radius) {
              const dir = e.x >= this.x ? 1 : -1;
              e.vx = dir * push; e.vy = -lift; e.onGround = false;
            }
          }
          fx.burst(this.x, this.y, '#a08fff', 24, Math.max(120, radius));
          fx.popup(this.x, this.y - 52, '冲击波 ' + Math.round(radius), '#a08fff');
        }
      }
      this.vy = 0; this.onGround = true; this.jumps = 0;
      this._airPeakY = this.y;
      /* 飞鼠落地复位（长按/待起跳状态由技能逻辑自行管理，此处置零会打断蓄力） */
      this._hoverT = 0; this._slowFall = false; this._flyUsed = false;
      this._ascending = false; this._tapTimes = [];
      this._airJumpPending = false; this._airHoldT = 0;
    } else {
      this.onGround = false;
      if (this.y < this._airPeakY) this._airPeakY = this.y;
    }
    this.x = clamp(this.x, 14, WORLD.w - 14);

    /* 状态机 */
    this.stateTime += dt;
    if (this.state === 'attack' && this.stateTime >= WEAPONS.blade.duration) this.state = 'idle';
    if (this.state !== 'attack' && this.state !== 'hit') {
      if (!this.onGround) this.state = 'jump';
      else if (blocking) this.state = 'block';
      else if (Math.abs(this.vx) > 10) { this.state = 'walk'; this.walkPhase += dt * 14; }
      else this.state = 'idle';
    }

    /* 近战判定（拳刃，命中范围内所有敌人） */
    if (this.state === 'attack' && !this.meleeHit) {
      const w = WEAPONS.blade, st = this.stateTime;
      if (st >= w.active[0] && st <= w.active[1]) {
        const hb = { x: this.x + this.facing * w.reach * 0.5 - w.hw / 2, y: this.y - w.hh, w: w.hw, h: w.hh };
        let meleeDmg = w.dmg;
        /* 玻璃大炮：伤害+50% */
        if (this.skill === 'glasscannon') meleeDmg = Math.round(meleeDmg * 1.5);
        /* 背水一战：血量<30%时攻击+60% */
        if (this.skill === 'laststand' && this.hp < (this._maxHp || CFG.maxHp) * 0.3) meleeDmg = Math.round(meleeDmg * 1.6);
        /* 双连击：50%概率连击 */
        const doubleHit = this.skill === 'doublestrike' && Math.random() < 0.5;
        for (const e of enemies) {
          if (e.dead) continue;
          if (aabb(hb, e.hurtbox)) {
            this.meleeHit = true;
            e.takeHit(meleeDmg, this, {});
            /* 吸血 / 神秘人士：统一走伤害结算回调 */
            this.onDamageDealt(e, meleeDmg, fx);
            /* 双连击 */
            if (doubleHit) {
              e.takeHit(meleeDmg, this, {});
              this.onDamageDealt(e, meleeDmg, fx);
              fx.popup(e.x, e.y - 52, '连击！', '#ff9a3d');
            }
            break;   // 单次挥击只命中一人
          }
        }
      }
    }

    /* 推进剂尾焰粒子 */
    if (this.buffs.boost > 0 && Math.abs(this.vx) > 40 && Math.random() < 0.5) {
      fx.spawn(this.x - this.facing * 8, this.y - 18, {
        color: '#ff9a3d', vx: -this.facing * 40, vy: rand(-20, 20), life: 0.3, maxLife: 0.3, size: 2,
      });
    }
  }

  /* 造成伤害后的统一结算：吸血（近战20%/远程15%）与神秘人士（全武器通用） */
  onDamageDealt(target, dmg, fx) {
    if (!target || !dmg || dmg <= 0) return;
    const g = this.game;
    if (this.skill === 'lifesteal') {
      const melee = this.weapon && this.weapon.type === 'melee';
      const hl = Math.max(1, Math.round(dmg * (melee ? 0.20 : 0.15)));
      this.hp = Math.min(this._maxHp || CFG.maxHp, this.hp + hl);
      fx.popup(this.x, this.y - 48, '+' + hl, '#ff5a5a');
    }
    if (this.skill === 'mystery' && !target.dead && Math.random() < 0.3) {
      const md = Math.max(1, Math.round(dmg * 0.5));
      target.takeHit(md, this, {});
      fx.popup(target.x, target.y - 52, '神秘 ' + md, '#c07bff');
      fx.burst(target.x, target.y - 24, '#c07bff', 10, 120);
    }
  }

  takeHit(dmg, from, opts) {
    const g = this.game, fx = g.fx;
    let d = dmg;

    /* 技能：铁壁 — 受伤减少20% */
    if (this.skill === 'ironhide') d *= 0.8;

    const blocked = this.state === 'block';
    if (this.buffs.shield > 0) d *= 0.4;
    if (blocked) d *= 0.25;
    d = Math.max(1, Math.round(d));

    /* 无敌期间不受伤害 */
    if (this._invincibleT > 0) d = 0;

    this.hp = Math.max(0, this.hp - d);
    this.hitstun = CFG.hitstun;

    /* 技能：荆棘反伤 — 反弹30%伤害 */
    if (this.skill === 'thorns' && d > 0 && from && !from.dead) {
      const refl = Math.max(1, Math.round(d * 0.3));
      from.hp = Math.max(0, from.hp - refl);
      fx.burst(from.x, from.y - 24, '#38d47a', 6, 80);
      fx.popup(from.x, from.y - 48, '反-' + refl, '#38d47a');
    }

    if (blocked) {
      fx.burst(this.x, this.y - 26, this.palette.shield, 8, 90);
      fx.popup(this.x, this.y - 46, '格挡', '#9fd8ff');
    } else {
      const dir = from.x >= this.x ? -1 : 1;
      this.vx = dir * CFG.knockback; this.vy = -120; this.onGround = false; this.state = 'hit';
      fx.burst(this.x, this.y - 24, from.palette.weapon, 14, 150);
      fx.popup(this.x, this.y - 48, '-' + d, '#ff5a5a');
      g.shake = 6;
    }

    /* 技能：震荡波已改为落地触发（见物理结算部分） */

    if (this.hp <= 0 && !this.dead) {
      /* 技能：复活图腾 — 给予一次复活 */
      if (this.skill === 'revive' && !this._reviveUsed) {
        this._reviveUsed = true;
        this.hp = Math.round((this._maxHp || CFG.maxHp) * 0.5);
        this._invincibleT = 1.5;
        this.state = 'idle'; this.hitstun = 0;
        this.vx = 0; this.vy = 0;
        fx.popup(this.x, this.y - 60, '复活！', '#ffd23f');
        fx.burst(this.x, this.y - 24, '#ffd23f', 30, 200);
        fx.burst(this.x, this.y - 24, '#ffffff', 15, 140);
        return;
      }
      this.dead = true; this.state = 'ko';
      this._koFall = true;
      fx.burst(this.x, this.y - 20, '#ffd23f', 26, 180);
      fx.burst(this.x, this.y - 20, '#ffffff', 12, 120);
      fx.popup(this.x, this.y - 60, 'KO', '#ff5a5a');
    }
  }

  /* ---------- 像素绘制 ---------- */
  draw(ctx) {
    const pal = this.palette, f = this.facing, t = this.animT;
    const walk = this.state === 'walk', jumpSt = this.state === 'jump';
    const attack = this.state === 'attack', block = this.state === 'block';
    const hit = this.state === 'hit', ko = this.state === 'ko', idle = this.state === 'idle';

    /* 地面阴影 */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    if (ko) {
      // KO 状态：阴影在身体旁边（侧身躺地）
      ctx.fillRect(Math.round(this.x - 14), Math.round(this.y - 2), 28, 3);
    } else if (this.onGround) {
      ctx.fillRect(Math.round(this.x - 10), Math.round(this.y), 20, 3);
    }

    /* 队友/敌人标识点（多人模式区分阵营） */
    if (!ko) {
      ctx.fillStyle = pal.body;
      ctx.fillRect(Math.round(this.x) - 2, Math.round(this.y) - 48, 4, 3);
    }

    ctx.save();
    ctx.translate(Math.round(this.x), Math.round(this.y));
    ctx.scale(f, 1);

    if (ko) {
      /* KO 动画：侧身躺地，身体旋转 90° */
      ctx.rotate(Math.PI / 2);  // 侧身倒地
      ctx.translate(0, -8);  // 身体略下沉
    } else if (idle || block) {
      ctx.translate(0, Math.sin(t * 4) * 0.6);
    }

    const swing = walk ? Math.sin(this.walkPhase) * 4 : 0;

    /* 推进器喷焰（仅在非 KO 且空中时） */
    if (!this.onGround && !ko) {
      const fl = 5 + Math.sin(t * 30) * 2;
      ctx.fillStyle = pal.flame; ctx.globalAlpha = 0.85;
      ctx.fillRect(-7, -1, 5, fl); ctx.fillRect(3, -1, 5, fl);
      ctx.globalAlpha = 1;
    }

    /* 腿 + 脚 */
    ctx.fillStyle = pal.dark;
    ctx.fillRect(-8 - swing, -12, 5, 12);
    ctx.fillRect(3 + swing, -12, 5, 12);
    ctx.fillStyle = '#101018';
    ctx.fillRect(-10 - swing, -2, 8, 3);
    ctx.fillRect(1 + swing, -2, 8, 3);

    /* 后臂 */
    ctx.fillStyle = pal.dark;
    ctx.fillRect(-10, -23, 4, 12);
    ctx.fillStyle = '#101018';
    ctx.fillRect(-10, -11, 4, 3);

    /* 躯干 */
    ctx.fillStyle = pal.body; ctx.fillRect(-9, -24, 18, 12);
    ctx.fillStyle = pal.dark; ctx.fillRect(-9, -14, 18, 3);
    ctx.fillStyle = pal.core; ctx.fillRect(-2, -21, 6, 5);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -20, 2, 2);

    /* 头部 */
    ctx.fillStyle = pal.body; ctx.fillRect(-6, -35, 13, 10);
    ctx.fillStyle = pal.dark; ctx.fillRect(-6, -35, 13, 2);
    ctx.fillStyle = pal.light; ctx.fillRect(-11, -38, 3, 4);
    ctx.fillStyle = attack ? '#ffffff' : pal.eye; ctx.fillRect(-3, -31, 8, 3);
    ctx.fillStyle = pal.light; ctx.fillRect(-1, -33, 3, 2);

    /* 防御状态：持枪手放到盾后面 */
    if (block) {
      /* 护盾（更突出、更大） */
      ctx.fillStyle = pal.shield; ctx.globalAlpha = 0.85;
      ctx.fillRect(7, -30, 6, 22);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(8, -28, 3, 18);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = pal.light; ctx.lineWidth = 1;
      ctx.strokeRect(7, -30, 6, 22);
      /* 武器手：缩到护盾后面（不露出） */
      ctx.fillStyle = pal.dark; ctx.fillRect(10, -23, 3, 8);
      /* 武器：仅露出一小部分在盾顶 */
      if (this.weapon.id === 'ray') {
        ctx.fillStyle = pal.weapon; ctx.fillRect(10, -30, 4, 2);
      } else if (this.weapon.id === 'plasma') {
        ctx.fillStyle = '#ff9a3d'; ctx.fillRect(10, -30, 3, 3);
      }
    } else {
      /* 前臂分支：拳刃 / 光线枪 / 等离子炮 */
      const wid = this.weapon.id;
      if (wid === 'ray') {
        ctx.fillStyle = pal.body; ctx.fillRect(7, -24, 4, 9);
        ctx.fillStyle = pal.dark; ctx.fillRect(7, -25, 12, 4);
        ctx.fillStyle = pal.weapon; ctx.fillRect(19, -25, 8, 2);
        ctx.fillStyle = '#fff'; ctx.fillRect(19, -25, 2, 2);
        if (this.cooldown > this.weapon.cooldown - 0.1) {
          ctx.fillStyle = '#ffffff'; ctx.fillRect(27, -27, 5, 6);
        }
      } else if (wid === 'plasma') {
        ctx.fillStyle = pal.body; ctx.fillRect(7, -24, 4, 9);
        ctx.fillStyle = pal.dark; ctx.fillRect(7, -26, 10, 6);
        ctx.fillStyle = '#ff9a3d'; ctx.fillRect(17, -25, 4, 4);
        ctx.fillStyle = '#fff'; ctx.fillRect(18, -24, 2, 2);
        if (this.cooldown > this.weapon.cooldown - 0.15) {
          ctx.fillStyle = '#ffd23f'; ctx.fillRect(21, -27, 4, 8);
        }
      } else if (attack) {
        ctx.fillStyle = pal.body; ctx.fillRect(6, -22, 6, 5);
        ctx.fillRect(6, -21, 12, 6);
        ctx.fillStyle = pal.weapon; ctx.globalAlpha = 0.9;
        ctx.fillRect(17, -20, 16, 3);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(17, -20, 16, 1);
        ctx.globalAlpha = 1;
        const prog = clamp(this.stateTime / WEAPONS.blade.duration, 0, 1);
        if (prog < 0.55) {
          ctx.globalAlpha = 0.22; ctx.fillStyle = pal.shield;
          ctx.fillRect(8, -28, 26, 16);
          ctx.globalAlpha = 1;
        }
      } else {
        const armSwing = walk ? -swing : 0;
        const lift = jumpSt ? 4 : 0;
        ctx.fillStyle = pal.body; ctx.fillRect(8, -23 - lift, 4, 12);
        ctx.fillStyle = pal.dark; ctx.fillRect(8, -12 - lift + armSwing, 4, 4);
      }
    }

    /* 能量盾增益光环 */
    if (this.buffs.shield > 0) {
      ctx.globalAlpha = 0.16 + 0.06 * Math.sin(t * 10);
      ctx.fillStyle = pal.shield;
      ctx.beginPath(); ctx.arc(0, -20, 23, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = pal.shield; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, -20, 23, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 受击白闪 */
    if (hit) {
      ctx.globalAlpha = 0.4; ctx.fillStyle = '#ffffff';
      ctx.fillRect(-9, -35, 18, 35);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    /* 无敌光环 */
    if (this._invincibleT > 0) {
      ctx.globalAlpha = 0.3 + 0.2 * Math.sin(this.animT * 20);
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(this.x, this.y - 20, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 飞行光环（飞鼠悬空） */
    if (this._hoverT > 0) {
      ctx.globalAlpha = 0.2 + 0.1 * Math.sin(this.animT * 15);
      ctx.fillStyle = '#38d47a';
      ctx.beginPath(); ctx.arc(this.x, this.y - 20, 22, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* 技能图标提示（头顶） */
    if (this.skill && !this.dead) {
      const sk = getSkill(this.skill);
      if (sk) {
        ctx.font = 'bold 7px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = sk.color;
        ctx.globalAlpha = 0.8;
        ctx.fillText(sk.icon, this.x, this.y - 52);
        ctx.globalAlpha = 1;
      }
    }

    /* 绘制宠物（驯兽大师） */
    if (this._pet) this._drawPet(ctx);
  }

  /* 飞鼠：普通跳跃（松手触发） */
  _doJump(fx) {
    const jumpS = CFG.jumpSpeed * (this.skill === 'swift' ? 1.15 : 1);
    this.vy = -jumpS; this.jumps = 1; this.onGround = false;
    fx.burst(this.x, this.y, '#8899bb', 5, 60);
  }

  /* 飞鼠：二段跳（空中轻点松手触发） */
  _doDoubleJump(fx) {
    if (this.jumps >= 2 || this.onGround) return;
    const jump2S = CFG.jump2Speed * (this.skill === 'swift' ? 1.15 : 1);
    this.vy = -jump2S; this.jumps = 2;
    fx.burst(this.x, this.y - 8, this.palette.shield, 8, 90);
  }

  /* 飞鼠：地面长按 0.8s → 飞升到场上最高处 */
  _startAscent(fx) {
    if (this._flyUsed || this._hoverT > 0 || this._ascending) return;
    this._flyUsed = true;
    this._ascending = true;
    this._slowFall = false;
    this.vy = -520;
    this.onGround = false;
    this._jumpHoldT = 0;
    this._tapTimes = [];
    fx.popup(this.x, this.y - 52, '飞鼠·飞升！', '#38d47a');
    fx.burst(this.x, this.y - 24, '#38d47a', 14, 120);
  }

  /* 飞鼠：空中连点三次 → 就地悬空（4秒） */
  _startHover(fx) {
    if (this._flyUsed || this._hoverT > 0) return;
    this._flyUsed = true;
    this._hoverT = 4;
    this._slowFall = false;
    this.vy = 0;
    this.onGround = false;
    this._tapTimes = [];
    fx.popup(this.x, this.y - 52, '飞鼠·悬空！', '#38d47a');
    fx.burst(this.x, this.y - 24, '#38d47a', 12, 100);
  }

  /* 轰炸机：每次拾取空投召唤一架，横穿全图一个来回后消失，每0.2秒丢一个10伤害炸弹 */
  _spawnBomber(g) {
    const fromLeft = Math.random() < 0.5;
    const speed = 120;
    const bomber = {
      x: fromLeft ? -20 : WORLD.w + 20,
      y: 100,
      vx: fromLeft ? speed : -speed,
      baseVx: fromLeft ? speed : -speed,
      dropT: 0,
      passes: 0,                                  // 已完成穿越次数（2 = 一个来回）
      life: Math.ceil((WORLD.w / speed) * 2) + 4, // 兜底存活时间
      ownerId: this.id,   /* 记录归属，炸弹不误伤主人 */
    };
    g._bombers = g._bombers || [];
    g._bombers.push(bomber);
    g.fx.popup(this.x, this.y - 52, '轰炸机！', '#ff9a3d');
  }

  /* ---------- 宠物AI（驯兽大师） ---------- */
  _updatePet(dt, enemies, g, fx) {
    const pet = this._pet;
    if (!pet) return;
    /* 主人死亡 → 宠物消失 */
    if (this.dead) {
      fx.burst(pet.x, pet.y - 12, '#38d47a', 12, 120);
      this._pet = null;
      return;
    }
    /* 宠物死亡 */
    if (pet.hp <= 0) {
      fx.burst(pet.x, pet.y - 12, '#38d47a', 16, 140);
      fx.popup(pet.x, pet.y - 30, '宠物倒下', '#ff5a5a');
      this._pet = null;
      return;
    }
    pet.cooldown = Math.max(0, pet.cooldown - dt);
    pet.animT += dt;
    pet.stateTime += dt;

    /* 目标选择：以召唤者（主人）为圆心、半径 200px 内的最近敌人 */
    let tgt = null, td = 1e9;
    const CHASE_RADIUS = 200;
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x - this.x) > CHASE_RADIUS) continue;   // 超出主人周围 200px 不追
      const d = Math.abs(e.x - pet.x);
      if (d < td) { td = d; tgt = e; }
    }

    /* 移动：追击圈内有目标就扑上去，否则跟随主人 */
    if (tgt) {
      const dx = tgt.x - pet.x;
      const adx = Math.abs(dx);
      /* 宠物可跳跃：目标在上方且自己在地面时起跳 */
      if (pet.onGround && tgt.y < pet.y - 10) {
        pet.vy = -300; pet.onGround = false;
        fx.burst(pet.x, pet.y - 10, '#38d47a', 5, 60);
      }
      if (adx > 30) {
        pet.facing = dx > 0 ? 1 : -1;
        pet.x += pet.facing * 95 * dt;
        pet.state = 'walk';
      } else if (pet.cooldown <= 0) {
        /* 攻击：扑咬 */
        pet.facing = tgt.x >= pet.x ? 1 : -1;
        pet.cooldown = 0.9;
        pet.state = 'attack';
        pet.stateTime = 0;
        const dmg = Math.max(3, Math.round(WEAPONS.blade.dmg * 0.5));
        tgt.takeHit(dmg, this, {});
        fx.burst(tgt.x, tgt.y - 24, this.palette.body, 8, 100);
        fx.popup(tgt.x, tgt.y - 48, '宠物-' + dmg, this.palette.light);
      } else {
        pet.state = 'idle';
      }
    } else {
      /* 跟随主人 */
      const dx = this.x - pet.x;
      const adx = Math.abs(dx);
      if (adx > 40) {
        pet.facing = dx > 0 ? 1 : -1;
        pet.x += pet.facing * 85 * dt;
        pet.state = 'walk';
      } else {
